name: Windows Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    # الخطوة 1: التحقق من الكود من المستودع
    - name: Checkout code
      uses: actions/checkout@v3

    # الخطوة 2: إعداد Java JDK
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # الخطوة 3: التحقق من الملفات في المجلد src
    - name: List files in src folder
      run: dir src

    # الخطوة 4: ترجمة الكود
    - name: Compile Java Project
      run: |
        mkdir out
        javac -d out src/*.java

    # الخطوة 5: تشغيل الكود (إذا لزم الأمر)
    - name: Run Main Class
      run: |
        java -cp out Main
